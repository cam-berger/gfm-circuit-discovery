[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gfmcd"
version = "0.1.0"
description = "Circuit discovery in genomic foundation models"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy", "scipy"]

[project.optional-dependencies]
models = ["transformers>=4.40", "datasets"]
dev = ["pytest", "pytest-xdist"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
