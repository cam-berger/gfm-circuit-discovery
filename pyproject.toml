[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gfmcd"
version = "0.1.0"
description = "Circuit discovery in genomic foundation models"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy", "scipy"]

[project.optional-dependencies]
models = ["transformers>=4.40", "datasets"]
genome = ["pyfaidx>=0.8", "numpy"]
dev = ["pytest", "pytest-xdist"]
# The interactive reverse-engineering layer (gfmcd.lab) and its notebooks.
lab = ["matplotlib>=3.7", "jupyter", "nbconvert", "nbformat", "ipykernel", "pyfaidx>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "genome: requires a downloaded reference genome (data/references/hg38.fa + GENCODE)",
    "checkpoint: requires external model checkpoints on disk",
    "slow: long optimization loop",
    "network: downloads a model or dataset",
    "gpu: requires CUDA/MPS",
]
