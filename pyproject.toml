[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gfmcd"
version = "0.1.0"
description = "Mechanistic discovery in genomic foundation models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy",
    "scipy",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
models = ["transformers>=4.40", "datasets"]
splicebert = ["transformers>=4.40", "pyfaidx>=0.8"]
genome = ["pyfaidx>=0.8", "numpy"]
dev = ["pytest", "pytest-xdist"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
