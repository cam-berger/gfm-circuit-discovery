# Phase 0: acceptor-recognition pilot on real 3'SS windows from the GUE
# `splice_reconstructed` benchmark (GENCODE/DeepSplice-derived human splice
# sites, reused here as real-data stand-ins for the original synthetic pilot).

data:
  dataset: leannmlindsey/GUE
  config: splice_reconstructed
  split: test                    # train/test/dev all available; test is a held-out slice
  base_url: "https://huggingface.co/datasets/{dataset}/resolve/main/GUE/{config}/{split}.csv"
  seq_len: 400                   # all rows are 400nt windows
  acceptor_label: 0              # label==0 -> true 3' acceptor site, AG at [ag_start, ag_start+2)
  donor_label: 1                 # label==1 -> donor site (not used in phase 0, reserved for step 4)
  negative_label: 2              # label==2 -> non-splice control window

# Coordinates are relative to the 0-indexed window and match the dataset's
# fixed splice-site position at index 200. Branch point / polypyrimidine
# tract boundaries are literature-typical *approximations* (GUE carries no
# per-sequence branch-point annotation) - see README "Known approximations".
coords:
  ag_start: 198                  # true acceptor AG occupies [198, 200)
  ag_len: 2
  ppt_start: 183                 # polypyrimidine tract: ~4-17 nt upstream of the AG
  # ppt_end is 197, NOT 198: position 197 is the -3 pyrimidine of the canonical
  # YAG 3' splice site (94.4% Y across this dataset's acceptor rows) and belongs
  # to the acceptor consensus, not the tract. Ending at 198 - as this did until
  # the 2026-08-22 audit - confounds "the tract drives m_acc" with "destroying
  # the 3'ss consensus drives m_acc". Keep this consistent with
  # acceptors.data.YAG_MINUS3_GUARD.
  ppt_end: 197
  bp_start: 160                  # branch-point region: ~18-40 nt upstream of the AG
  bp_end: 183
  decoy_search_from: 201         # search window for a downstream decoy AG
  decoy_search_to: 280
  far_start: 40                  # phase1: deep-intronic control region, far from BP/PPT
  far_end: 55
  bp_search_from: 45             # phase3: branch-point motif search window (upstream distance from AG)
  bp_search_to: 18

phase0:
  n_acceptor: 200                 # sampled acceptor windows
  n_negative: 200                 # sampled non-splice control windows
  seed: 0
  n_boot: 5000                    # bootstrap resamples per statistic
  alpha: 0.05                     # 95% CI

output:
  results_dir: results
  prefix: phase0
