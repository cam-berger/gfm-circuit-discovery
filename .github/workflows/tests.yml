name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Provenance guards verify historical manifest revisions with
          # `git cat-file`; a depth-one checkout cannot satisfy them.
          fetch-depth: 0
          # Compact evidence attestations resolve the pinned annotated archive tag.
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Check recorded artifact index
        # The reviewer-facing integrity check requires only Python and Git.
        run: python scripts/verify_manifest.py

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --extra splicebert --extra biology --extra dev

      - name: Run full test suite
        # Extras must be repeated here: bare `uv run pytest` re-syncs to the default
        # dependency set and drops splicebert/biology/dev (incl. pytest itself), so the
        # manifest guard and the data-gated suite would not actually run. See
        # REPRODUCE.md, Environment.
        run: uv run --locked --extra splicebert --extra biology --extra dev pytest -ra
