name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --extra splicebert --extra dev

      - name: Run full test suite
        # Extras must be repeated here: bare `uv run pytest` re-syncs to the default
        # dependency set and drops splicebert/dev (incl. pytest itself), so the manifest
        # guard and the data-gated suite would not actually run. See docs/REVIEW_OPEN_QUESTIONS.md.
        run: uv run --extra splicebert --extra dev pytest
