<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="504pt" height="360pt" viewBox="0 0 980 700" version="1.1">

  <title>Donor–acceptor binding in SpliceBERT</title>
  <desc>The donor token emits a query (Q). The acceptor token stores an address (K, written with help from head L2H15) and a payload (V). Head L3H1 performs a content-addressed read: Q·K selects the acceptor site and attention transports V back into the donor's residual stream.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .sans  { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono  { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
      .ttl   { font-size: 21px; font-weight: 700; fill: #16232E; }
      .sub   { font-size: 12.5px; fill: #5A6672; }
      .stage { font-size: 8.5px; font-weight: 700; fill: #A3B0BA; letter-spacing: 0.9px; }
      .ntitle{ font-size: 13px;  font-weight: 700; }
      .ncap  { font-size: 10px;  fill: #5A6672; }
      .vec   { font-size: 20px;  font-weight: 700; }
      .edge  { font-size: 10px;  fill: #5A6672; font-style: italic; }
      .lgd   { font-size: 10px; fill: #46525C; }
      .note  { font-size: 9.5px; fill: #8794A0; }
    ]]></style>

    <marker id="ahBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B6FB8"/>
    </marker>
    <marker id="ahGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#00845F"/>
    </marker>
    <marker id="ahOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#C25A00"/>
    </marker>
    <marker id="ahWrite" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B6FB8"/>
    </marker>

    <linearGradient id="gWrite" gradientUnits="userSpaceOnUse" x1="390" y1="506" x2="272" y2="551">
      <stop offset="0" stop-color="#6A4A9C"/>
      <stop offset="1" stop-color="#0B6FB8"/>
    </linearGradient>
    <linearGradient id="gWriteLgd" gradientUnits="userSpaceOnUse" x1="760" y1="0" x2="790" y2="0">
      <stop offset="0" stop-color="#6A4A9C"/>
      <stop offset="1" stop-color="#0B6FB8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="980" height="700" fill="#FFFFFF"/>

  <!-- ============ TITLE ============ -->
  <text class="sans ttl" x="490" y="31" text-anchor="middle">Donor–acceptor binding in SpliceBERT</text>
  <text class="sans sub" x="490" y="53" text-anchor="middle">A content-addressed read: the donor asks, the acceptor answers, the answer is written back into the donor.</text>

  <!-- ============ STAGE BANDS ============ -->
  <g>
    <rect x="62" y="70"  width="900" height="80"  fill="#F7F9FB"/>
    <rect x="62" y="240" width="900" height="172" fill="#F7F9FB"/>
    <rect x="62" y="528" width="900" height="110" fill="#F7F9FB"/>
  </g>
  <g class="sans stage">
    <text transform="translate(34,110) rotate(-90)" text-anchor="middle">1 SEQUENCE</text>
    <text transform="translate(34,195) rotate(-90)" text-anchor="middle">2 TOKEN STATES</text>
    <text transform="translate(34,326) rotate(-90)" text-anchor="middle">3 PROJECTIONS</text>
    <text transform="translate(34,470) rotate(-90)" text-anchor="middle">4 ATTENTION READ</text>
    <text transform="translate(34,583) rotate(-90)" text-anchor="middle">5 WRITE-BACK</text>
  </g>

  <!-- ==== DONOR RESIDUAL-STREAM SPINE (behind nodes) ==== -->
  <path d="M 245 169 L 245 552" fill="none" stroke="#0B6FB8" stroke-opacity="0.35"
        stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>
  <text class="sans edge" transform="translate(232,495) rotate(-90)" text-anchor="middle"
        fill="#0B6FB8" fill-opacity="0.7">donor residual stream</text>

  <!-- ============ STAGE 1 : SEQUENCE TRACK ============ -->
  <text class="sans ncap" x="88" y="79">Illustrative genomic input (5′ → 3′)</text>

  <rect x="88" y="86" width="848" height="40" rx="6" fill="#F4F7FA" stroke="#9AA7B2" stroke-width="1.1"/>
  <rect x="276" y="86" width="414" height="40" fill="#ECEFF2"/>
  <rect x="214" y="86" width="62"  height="40" fill="#D6E7F5" stroke="#0B6FB8" stroke-width="1.5"/>
  <rect x="690" y="86" width="62"  height="40" fill="#D3EDE2" stroke="#00845F" stroke-width="1.5"/>

  <text class="mono seq" x="151" y="112" text-anchor="middle" fill="#16232E" font-size="14">…CAG</text>
  <text class="mono"     x="245" y="112" text-anchor="middle" fill="#084E82" font-size="14" font-weight="700">GT</text>
  <text class="sans"     x="483" y="112" text-anchor="middle" fill="#7A868F" font-size="12" font-style="italic">… intron sequence …</text>
  <text class="mono"     x="721" y="112" text-anchor="middle" fill="#04654A" font-size="14" font-weight="700">AG</text>
  <text class="mono"     x="844" y="112" text-anchor="middle" fill="#16232E" font-size="14">GTA…</text>

  <!-- site labels sit BESIDE the connectors, never under them -->
  <text class="sans" x="252" y="147" text-anchor="start" fill="#084E82" font-size="10.5" font-weight="700">donor site</text>
  <text class="sans" x="714" y="147" text-anchor="end"   fill="#04654A" font-size="10.5" font-weight="700">acceptor site</text>

  <!-- ==== EDGES : sequence -> token states ==== -->
  <path d="M 245 128 L 245 165" fill="none" stroke="#0B6FB8" stroke-width="2" marker-end="url(#ahBlue)"/>
  <path d="M 721 128 C 721 146, 734 152, 741 164" fill="none" stroke="#00845F" stroke-width="2" marker-end="url(#ahGreen)"/>

  <!-- ============ STAGE 2 : TOKEN STATES ============ -->
  <rect x="140" y="169" width="210" height="54" rx="8" fill="#EAF2FA" stroke="#0B6FB8" stroke-width="1.7"/>
  <text class="sans ntitle" x="245" y="192" text-anchor="middle" fill="#084E82">Donor state</text>
  <text class="sans ncap"   x="245" y="210" text-anchor="middle">produces the query</text>

  <rect x="631" y="169" width="228" height="54" rx="8" fill="#E6F4EE" stroke="#00845F" stroke-width="1.7"/>
  <text class="sans ntitle" x="745" y="192" text-anchor="middle" fill="#04654A">Acceptor state</text>
  <text class="sans ncap"   x="745" y="210" text-anchor="middle">holds address + payload</text>

  <!-- ==== EDGES : token states -> projections ==== -->
  <path d="M 245 223 L 245 330" fill="none" stroke="#0B6FB8" stroke-width="2" marker-end="url(#ahBlue)"/>

  <path d="M 700 223 C 676 240, 662 250, 648 254" fill="none" stroke="#00845F" stroke-width="2"
        stroke-dasharray="7 4" marker-end="url(#ahGreen)"/>
  <path d="M 600 304 L 600 330" fill="none" stroke="#00845F" stroke-width="2"
        stroke-dasharray="7 4" marker-end="url(#ahGreen)"/>

  <path d="M 838 223 C 841 258, 832 294, 830 328" fill="none" stroke="#C25A00" stroke-width="2"
        stroke-dasharray="1.5 4.5" stroke-linecap="round" marker-end="url(#ahOrange)"/>

  <!-- ============ STAGE 3 : HEAD L2H15 + Q/K/V ============ -->
  <rect x="512" y="256" width="176" height="48" rx="24" fill="#E6F4EE" stroke="#00845F" stroke-width="1.7"/>
  <text class="sans" x="600" y="277" text-anchor="middle" fill="#04654A" font-size="12" font-weight="700">L2H15</text>
  <text class="sans" x="600" y="293" text-anchor="middle" fill="#5A6672" font-size="9.5">key route · helps build K</text>

  <!-- captions placed BESIDE each vector so no edge ever crosses text -->
  <circle cx="245" cy="360" r="26" fill="#EAF2FA" stroke="#0B6FB8" stroke-width="1.9"/>
  <text class="sans vec"  x="245" y="367" text-anchor="middle" fill="#084E82">Q</text>
  <text class="sans ncap" x="212" y="364" text-anchor="end">donor query</text>

  <circle cx="600" cy="360" r="26" fill="#E6F4EE" stroke="#00845F" stroke-width="1.9"/>
  <text class="sans vec"  x="600" y="367" text-anchor="middle" fill="#04654A">K</text>
  <text class="sans ncap" x="634" y="364" text-anchor="start">acceptor address</text>

  <circle cx="830" cy="360" r="26" fill="#FBEEE2" stroke="#C25A00" stroke-width="1.9"/>
  <text class="sans vec"  x="830" y="367" text-anchor="middle" fill="#8F4200">V</text>
  <text class="sans ncap" x="863" y="364" text-anchor="start">acceptor payload</text>

  <!-- ==== EDGES : Q/K/V -> L3H1 ==== -->
  <path d="M 245 388 C 245 425, 262 448, 300 458" fill="none" stroke="#0B6FB8" stroke-width="2"
        marker-end="url(#ahBlue)"/>
  <path d="M 600 388 L 600 430" fill="none" stroke="#00845F" stroke-width="2"
        stroke-dasharray="7 4" marker-end="url(#ahGreen)"/>
  <path d="M 830 388 C 830 425, 800 448, 740 458" fill="none" stroke="#C25A00" stroke-width="2"
        stroke-dasharray="1.5 4.5" stroke-linecap="round" marker-end="url(#ahOrange)"/>

  <!-- ============ STAGE 4 : L3H1 CONTENT-ADDRESSED READ ============ -->
  <rect x="310" y="434" width="420" height="72" rx="36" fill="#F1ECF8" stroke="#6A4A9C" stroke-width="1.9"/>
  <text class="sans" x="520" y="463" text-anchor="middle" fill="#4E3576" font-size="13.5" font-weight="700">L3H1 · content-addressed read</text>
  <text class="sans" x="520" y="483" text-anchor="middle" fill="#5A6672" font-size="10.5">Q·K selects the site  →  attention transports V</text>

  <!-- ============ STAGE 5 : WRITE-BACK ============ -->
  <path d="M 390 506 C 350 528, 310 538, 274 549" fill="none" stroke="url(#gWrite)" stroke-width="2.8"
        marker-end="url(#ahWrite)"/>
  <text class="sans edge" x="400" y="534">acceptor payload enters the donor's stream</text>

  <rect x="125" y="552" width="240" height="56" rx="8" fill="#EAF2FA" stroke="#0B6FB8" stroke-width="1.9"/>
  <text class="sans ntitle" x="245" y="576" text-anchor="middle" fill="#084E82">Donor update</text>
  <text class="sans ncap"   x="245" y="594" text-anchor="middle">partner-informed output</text>

  <!-- ============ LEGEND ============ -->
  <line x1="62" y1="650" x2="962" y2="650" stroke="#E1E7EC" stroke-width="1"/>

  <g>
    <line x1="88" y1="666" x2="118" y2="666" stroke="#0B6FB8" stroke-width="2"/>
    <text class="sans lgd" x="125" y="670">Q · query (donor)</text>

    <line x1="300" y1="666" x2="330" y2="666" stroke="#00845F" stroke-width="2" stroke-dasharray="7 4"/>
    <text class="sans lgd" x="337" y="670">K · address (acceptor)</text>

    <line x1="530" y1="666" x2="560" y2="666" stroke="#C25A00" stroke-width="2" stroke-dasharray="1.5 4.5" stroke-linecap="round"/>
    <text class="sans lgd" x="567" y="670">V · payload (acceptor)</text>

    <line x1="760" y1="666" x2="790" y2="666" stroke="url(#gWriteLgd)" stroke-width="2.8"/>
    <text class="sans lgd" x="797" y="670">write-back into donor</text>
  </g>

  <text class="sans note" x="88" y="688">rounded box = token state   ·   pill = attention head   ·   circle = projected vector</text>

</svg>
