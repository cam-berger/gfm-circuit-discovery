<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860"><defs><style type="text/css"><![CDATA[ .sans{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif} .mono{font-family:"SF Mono",Menlo,Consolas,monospace} ]]></style><pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="5" stroke="#FFFFFF" stroke-width="2.2"/></pattern></defs><rect x="0" y="0" width="1440" height="860" fill="#FFFFFF"/><text class="sans" x="720.0" y="40.0" font-size="22" fill="#16232E" text-anchor="middle" font-weight="700">One position table, two carriers, two very different stories</text><text class="sans" x="720.0" y="64.0" font-size="13" fill="#8794A0" text-anchor="middle">SpliceBERT</text><rect x="570.0" y="92.0" width="300.0" height="54.0" rx="5" fill="#F7F9FB" stroke="#E1E7EC" stroke-width="1"/><line x1="582.0" y1="104.0" x2="582.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><line x1="602.0" y1="104.0" x2="602.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><line x1="622.0" y1="104.0" x2="622.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><line x1="642.0" y1="104.0" x2="642.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><line x1="662.0" y1="104.0" x2="662.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><line x1="682.0" y1="104.0" x2="682.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><line x1="702.0" y1="104.0" x2="702.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><line x1="722.0" y1="104.0" x2="722.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><line x1="742.0" y1="104.0" x2="742.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><line x1="762.0" y1="104.0" x2="762.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><line x1="782.0" y1="104.0" x2="782.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><line x1="802.0" y1="104.0" x2="802.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><line x1="822.0" y1="104.0" x2="822.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><line x1="842.0" y1="104.0" x2="842.0" y2="134.0" stroke="#8794A0" stroke-width="1" stroke-linecap="butt" stroke-opacity="0.35"/><text class="sans" x="720.0" y="116.0" font-size="13.5" fill="#16232E" text-anchor="middle" font-weight="700">Position-embedding table  P</text><text class="mono" x="720.0" y="134.0" font-size="10.5" fill="#8794A0" text-anchor="middle">1026 x 512</text><line x1="720.0" y1="146.0" x2="720.0" y2="176.0" stroke="#8794A0" stroke-width="1.6" stroke-linecap="butt"/><path d="M 720.0,176.0 L 400.0,176.0 L 400.0,198.0" fill="none" stroke="#0B6FB8" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 720.0,176.0 L 1040.0,176.0 L 1040.0,198.0" fill="none" stroke="#C25A00" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="602.0" y="220.0" width="236.0" height="46.0" rx="5" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="1"/><text class="sans" x="720.0" y="239.0" font-size="11.5" fill="#16232E" text-anchor="middle" font-weight="700">Orthogonal subspaces</text><text class="mono" x="720.0" y="256.0" font-size="10.5" fill="#5A6672" text-anchor="middle">plane overlap  0.0003</text><rect x="250.0" y="198.0" width="300.0" height="52.0" rx="6" fill="#F7F9FB" stroke="#0B6FB8" stroke-width="1.8"/><text class="sans" x="400.0" y="219.0" font-size="12.5" fill="#16232E" text-anchor="middle" font-weight="700">Period-3 carrier</text><text class="sans" x="400.0" y="236.0" font-size="10.5" fill="#5A6672" text-anchor="middle">bins 339-345    circularity 0.977</text><line x1="400.0" y1="250.0" x2="400.0" y2="274.0" stroke="#0B6FB8" stroke-width="2.2" stroke-linecap="round"/><polygon points="400.0,280.0 396.7,271.6 403.3,271.6" fill="#0B6FB8"/><rect x="250.0" y="280.0" width="300.0" height="52.0" rx="6" fill="#F7F9FB" stroke="#0B6FB8" stroke-width="1.8"/><text class="sans" x="400.0" y="301.0" font-size="12.5" fill="#16232E" text-anchor="middle" font-weight="700">Six comb heads</text><text class="sans" x="400.0" y="318.0" font-size="10.5" fill="#5A6672" text-anchor="middle">L0H0  L0H11  L1H10  L1H12  L2H2  L2H15</text><line x1="400.0" y1="332.0" x2="400.0" y2="356.0" stroke="#0B6FB8" stroke-width="2.2" stroke-linecap="round"/><polygon points="400.0,362.0 396.7,353.6 403.3,353.6" fill="#0B6FB8"/><rect x="250.0" y="362.0" width="300.0" height="52.0" rx="6" fill="#F7F9FB" stroke="#0B6FB8" stroke-width="1.8"/><text class="sans" x="400.0" y="383.0" font-size="12.5" fill="#16232E" text-anchor="middle" font-weight="700">L2H15</text><text class="sans" x="400.0" y="400.0" font-size="10.5" fill="#5A6672" text-anchor="middle">the acceptor addresser</text><line x1="400.0" y1="414.0" x2="400.0" y2="438.0" stroke="#0B6FB8" stroke-width="2.2" stroke-linecap="round"/><polygon points="400.0,444.0 396.7,435.6 403.3,435.6" fill="#0B6FB8"/><rect x="250.0" y="444.0" width="300.0" height="52.0" rx="6" fill="#F7F9FB" stroke="#0B6FB8" stroke-width="1.8"/><text class="sans" x="400.0" y="465.0" font-size="12.5" fill="#16232E" text-anchor="middle" font-weight="700">L3H1</text><text class="sans" x="400.0" y="482.0" font-size="10.5" fill="#5A6672" text-anchor="middle">the reader</text><line x1="400.0" y1="496.0" x2="400.0" y2="520.0" stroke="#0B6FB8" stroke-width="2.2" stroke-linecap="round"/><polygon points="400.0,526.0 396.7,517.6 403.3,517.6" fill="#0B6FB8"/><rect x="250.0" y="526.0" width="300.0" height="52.0" rx="6" fill="#EAF3FA" stroke="#0B6FB8" stroke-width="1.8"/><text class="sans" x="400.0" y="547.0" font-size="12.5" fill="#16232E" text-anchor="middle" font-weight="700">Acceptor prediction</text><text class="sans" x="400.0" y="564.0" font-size="10.5" fill="#5A6672" text-anchor="middle">donor-acceptor coupling</text><rect x="100.0" y="452.0" width="108.0" height="36.0" rx="5" fill="#FFFFFF" stroke="#8794A0" stroke-width="1"/><text class="sans" x="154.0" y="475.0" font-size="12" fill="#16232E" text-anchor="middle" font-weight="700">Donor</text><line x1="208.0" y1="470.0" x2="239.0" y2="470.0" stroke="#5A6672" stroke-width="1.8" stroke-linecap="round"/><polygon points="244.0,470.0 237.0,472.8 237.0,467.2" fill="#5A6672"/><rect x="890.0" y="198.0" width="300.0" height="52.0" rx="6" fill="#F7F9FB" stroke="#C25A00" stroke-width="1.8"/><text class="sans" x="1040.0" y="219.0" font-size="12.5" fill="#16232E" text-anchor="middle" font-weight="700">~10.63 carrier</text><text class="sans" x="1040.0" y="236.0" font-size="10.5" fill="#5A6672" text-anchor="middle">bins 94-100    circularity 0.992</text><line x1="1040.0" y1="250.0" x2="1040.0" y2="274.0" stroke="#C25A00" stroke-width="2.2" stroke-linecap="round"/><polygon points="1040.0,280.0 1036.7,271.6 1043.3,271.6" fill="#C25A00"/><rect x="890.0" y="280.0" width="300.0" height="52.0" rx="6" fill="#F7F9FB" stroke="#C25A00" stroke-width="1.8"/><text class="sans" x="1040.0" y="301.0" font-size="12.5" fill="#16232E" text-anchor="middle" font-weight="700">8 Level-A heads</text><text class="sans" x="1040.0" y="318.0" font-size="10.5" fill="#5A6672" text-anchor="middle">L2H12  L3H3  L3H5  L3H8  L3H9  L3H11  L3H13  L4H13</text><line x1="1040.0" y1="332.0" x2="1040.0" y2="356.0" stroke="#C25A00" stroke-width="2.2" stroke-linecap="round"/><polygon points="1040.0,362.0 1036.7,353.6 1043.3,353.6" fill="#C25A00"/><rect x="890.0" y="362.0" width="300.0" height="52.0" rx="6" fill="#F7F9FB" stroke="#C25A00" stroke-width="1.8"/><text class="sans" x="1040.0" y="383.0" font-size="12.5" fill="#16232E" text-anchor="middle" font-weight="700">Survives the softmax</text><text class="sans" x="1040.0" y="400.0" font-size="10.5" fill="#5A6672" text-anchor="middle">carrier-dependent, content-independent</text><line x1="1040.0" y1="414.0" x2="1040.0" y2="438.0" stroke="#55606B" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="1040.0,444.0 1036.7,435.6 1043.3,435.6" fill="#55606B"/><rect x="890.0" y="444.0" width="300.0" height="52.0" rx="6" fill="#FFFFFF" stroke="#55606B" stroke-width="1.8" stroke-dasharray="5 4"/><text class="sans" x="1040.0" y="465.0" font-size="12.5" fill="#16232E" text-anchor="middle" font-weight="700">Function unknown</text><text class="sans" x="1040.0" y="482.0" font-size="10.5" fill="#5A6672" text-anchor="middle">no downstream effect established</text><line x1="994.0" y1="512.0" x2="1086.0" y2="512.0" stroke="#55606B" stroke-width="2.5" stroke-linecap="round"/><text class="sans" x="1040.0" y="534.0" font-size="10.5" fill="#8794A0" text-anchor="middle">No causal path to splicing, chromatin</text><text class="sans" x="1040.0" y="549.0" font-size="10.5" fill="#8794A0" text-anchor="middle">or translation has been demonstrated.</text><text class="sans" x="240.0" y="648.0" font-size="11.5" fill="#0B6FB8" font-weight="700">The clock does a job</text><rect x="240.0" y="660.0" width="320.0" height="121.0" rx="5" fill="#F7F9FB" stroke="#E1E7EC" stroke-width="1"/><line x1="240.0" y1="660.0" x2="240.0" y2="781.0" stroke="#0B6FB8" stroke-width="3" stroke-linecap="butt"/><text class="sans" x="254.0" y="684.0" font-size="10.5" fill="#5A6672">Coupling, carrier intact</text><text class="mono" x="546.0" y="684.0" font-size="10.5" fill="#16232E" text-anchor="end" font-weight="700">0.946</text><text class="sans" x="254.0" y="703.0" font-size="10.5" fill="#5A6672">Coupling, carrier deleted</text><text class="mono" x="546.0" y="703.0" font-size="10.5" fill="#16232E" text-anchor="end" font-weight="700">0.026</text><text class="sans" x="254.0" y="722.0" font-size="10.5" fill="#5A6672">Restoring L2H15 recovers</text><text class="mono" x="546.0" y="722.0" font-size="10.5" fill="#16232E" text-anchor="end" font-weight="700">36.3%</text><text class="sans" x="254.0" y="741.0" font-size="10.5" fill="#5A6672">Exon damage</text><text class="mono" x="546.0" y="741.0" font-size="10.5" fill="#16232E" text-anchor="end" font-weight="700">0.159 nats</text><text class="sans" x="254.0" y="760.0" font-size="10.5" fill="#5A6672">Intron damage</text><text class="mono" x="546.0" y="760.0" font-size="10.5" fill="#16232E" text-anchor="end" font-weight="700">0.042 nats</text><text class="sans" x="880.0" y="648.0" font-size="11.5" fill="#C25A00" font-weight="700">The carrier is read, and that is all we know</text><rect x="880.0" y="660.0" width="320.0" height="121.0" rx="5" fill="#F7F9FB" stroke="#E1E7EC" stroke-width="1"/><line x1="880.0" y1="660.0" x2="880.0" y2="781.0" stroke="#C25A00" stroke-width="3" stroke-linecap="butt"/><text class="sans" x="894.0" y="684.0" font-size="10.5" fill="#5A6672">Post-softmax readers</text><text class="mono" x="1186.0" y="684.0" font-size="10.5" fill="#16232E" text-anchor="end" font-weight="700">8</text><text class="sans" x="894.0" y="703.0" font-size="10.5" fill="#5A6672">Kept after carrier deleted</text><text class="mono" x="1186.0" y="703.0" font-size="10.5" fill="#16232E" text-anchor="end" font-weight="700">40-44%</text><text class="sans" x="894.0" y="722.0" font-size="10.5" fill="#5A6672">Kept after reciprocal band</text><text class="mono" x="1186.0" y="722.0" font-size="10.5" fill="#16232E" text-anchor="end" font-weight="700">89-97%</text><text class="sans" x="894.0" y="741.0" font-size="10.5" fill="#5A6672">Kept after content shuffle</text><text class="mono" x="1186.0" y="741.0" font-size="10.5" fill="#16232E" text-anchor="end" font-weight="700">93-107%</text><text class="sans" x="894.0" y="760.0" font-size="10.5" fill="#5A6672">Downstream function</text><text class="mono" x="1186.0" y="760.0" font-size="10.5" fill="#16232E" text-anchor="end" font-weight="700">unknown</text><line x1="58.0" y1="814.0" x2="1382.0" y2="814.0" stroke="#E1E7EC" stroke-width="1" stroke-linecap="butt"/><text class="sans" x="58.0" y="834.0" font-size="10" fill="#8794A0">Period-3 circuit measured in SpliceBERT.1024nt.  Level-A heads measured in SpliceBERT.510nt (multi-species), against its human-only twin.</text></svg>